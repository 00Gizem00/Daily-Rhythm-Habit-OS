name: iOS foundation

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate generated project
        run: python3 scripts/generate_project.py --check
      - name: Test project generation and stale-source guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test persistence and recurrence
        run: swift test --package-path Packages/DailyRhythmCore
      - name: Build iPhone app and widgets
        run: >-
          xcodebuild
          -project DailyRhythm.xcodeproj
          -scheme DailyRhythm
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

