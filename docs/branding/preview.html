<title>Daily Rhythm — logo and launch design</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#e7e8e4;color:#203040;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1060px;margin:auto}h1{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}p{color:#47545a;font-size:14px;margin:0 0 30px}.boards{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}figure{margin:0;flex:1;min-width:220px;max-width:320px}figcaption{font-size:13px;font-weight:600;margin:0 0 12px}.icon{width:100%;aspect-ratio:1;border-radius:22%;display:block}.screen{width:100%;aspect-ratio:393/852;background:rgb(97% 96% 93%);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}.dark{background:rgb(7% 10% 14%);color:rgb(94% 95% 97%)}.lockup{transform:translateY(-16px);display:flex;flex-direction:column;align-items:center;gap:12px}.mark{width:180px;height:180px;background:rgb(7.8% 14.9% 16.1%);mask:url('launch-logo-source.png') center/contain no-repeat;-webkit-mask:url('launch-logo-source.png') center/contain no-repeat}.dark .mark{background:rgb(51% 79% 65%)}.title{font-size:30px;font-weight:600;line-height:36px;letter-spacing:-.035em}.subtitle{font-size:13px;font-weight:500;line-height:16px}.caption{margin-top:18px;max-width:260px;line-height:1.6}a{color:inherit;text-underline-offset:3px}@media(max-width:620px){body{padding:24px}.boards{display:grid;grid-template-columns:1fr}figure{max-width:320px;width:100%;margin:auto}.icon{width:180px}}
</style>
<main>
<h1>Daily Rhythm / Habit OS</h1>
<p>Logo and launch design preview. These are design boards, not screenshots of a running iPhone.</p>
<div class="boards">
<figure><figcaption>App icon</figcaption><img class="icon" src="app-icon-v2-source.png" alt="Mint daily cycle, ivory completion mark and coral next-step dot on deep teal"><p class="caption">A daily cycle. A small step forward.<br>The iOS icon keeps a full opaque square; the system applies its rounded mask.</p></figure>
<figure><figcaption>Launch · Light</figcaption><div class="screen"><div class="lockup"><div class="mark" aria-hidden="true"></div><div class="title">Daily Rhythm</div><div class="subtitle">Habit OS</div></div></div></figure>
<figure><figcaption>Launch · Dark</figcaption><div class="screen dark"><div class="lockup"><div class="mark" aria-hidden="true"></div><div class="title">Daily Rhythm</div><div class="subtitle">Habit OS</div></div></div></figure>
</div>
</main>
